[package]
name = "soulcaster-cli"
description = "The plain Soulcaster CLI, on the same engine as the app. It can validate a Config, print its plan, run it, Import one for review and Save one to GitHub."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "soulcaster"
path = "src/main.rs"

[dependencies]
soulcaster-core.workspace = true
soulcaster-repo.workspace = true
soulcaster-engine.workspace = true
serde_json.workspace = true
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
