[package]
name = "soulcaster-core"
description = "Soulcaster's engine vocabulary: Catalog, Config, Plan, Item states, the event stream and the command-runner seam. No GUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The schema and its patterns were proven against these exact versions in the Config format work.
jsonschema = { version = "=0.60.2", default-features = false }
regex = "=1.13.1"
unicode-normalization = "0.1"
zeroize = "1"
