[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
macflayer-core = { path = "crates/macflayer-core" }
macflayer-engine = { path = "crates/macflayer-engine" }
macflayer-repo = { path = "crates/macflayer-repo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
