[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
soulcaster-core = { path = "crates/soulcaster-core" }
soulcaster-engine = { path = "crates/soulcaster-engine" }
soulcaster-repo = { path = "crates/soulcaster-repo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
